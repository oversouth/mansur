name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Audit dependencies (pip-audit)
      run: |
        # Scans your requirements file against the PyPI vulnerability database
        pip-audit -r requirements.txt

    - name: Scan source code (Bandit)
      run: |
        # Scans your Python code for security flaws (-r is recursive, -ll flags medium/high severity)
        bandit -r . -ll
